[project]
name = "callytics"
version = "0.1.0"
description = "Callytics - AI-native CRM for education sales (LeadSquared replacement)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0.30",
    "pymysql>=1.1.1",
    "alembic>=1.13",
    "requests>=2.32.4",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn>=0.30", "python-multipart>=0.0.18"]
broker = ["confluent-kafka>=2.4"]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "fastapi>=0.111",
    "types-requests",
]

[project.scripts]
callytics = "callytics.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["callytics"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Alembic writes these; reformatting them obscures the diff against autogenerate.
extend-exclude = ["callytics/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 flags `Depends(...)` in argument defaults, which is how FastAPI
# dependency injection is written. Suppressed only in the HTTP layer.
"callytics/api/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["confluent_kafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
